services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: vnfin_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vnfin_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnfin_db}
      POSTGRES_USER: ${POSTGRES_USER:-vnfin_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnfin_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./src/agents/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped

  api:
    build: .
    container_name: vnfin_api
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_storage:

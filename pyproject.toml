[project]
name = "vnfin-copilot"
version = "0.1.0"
description = "Enterprise Vietnamese Financial AI Platform (Hybrid RAG, Multi-Agent, Text-to-SQL, Fine-tuned SLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
rag = [
    "docling>=2.0.0",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
